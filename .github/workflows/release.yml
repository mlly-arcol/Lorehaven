name: Release Lorehaven

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Tests\NativeTavern.Tests\NativeTavern.Tests.csproj
          dotnet restore Lorehaven.csproj -r win-x64

      - name: Verify plugin packages match source
        shell: pwsh
        run: ./.github/scripts/verify-plugin-packages.ps1

      - name: Test
        shell: pwsh
        run: dotnet test Tests\NativeTavern.Tests\NativeTavern.Tests.csproj -c Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish Lorehaven.csproj -c Release -r win-x64 --self-contained true -o publish --no-restore

      - name: Create checksum
        shell: pwsh
        run: |
          $assets = @(
            'publish\Lorehaven.exe'
            'PluginPackages\nativetavern.dynamic-character-status.ntplugin'
            'PluginPackages\nativetavern.story-prompts.ntplugin'
            'PluginPackages\nativetavern.dice-random-tables.ntplugin'
            'PluginPackages\nativetavern.story-timeline.ntplugin'
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($asset))"
          }
          $checksums | Set-Content -LiteralPath publish\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            publish\Lorehaven.exe publish\SHA256SUMS.txt `
            PluginPackages\nativetavern.dynamic-character-status.ntplugin `
            PluginPackages\nativetavern.story-prompts.ntplugin `
            PluginPackages\nativetavern.dice-random-tables.ntplugin `
            PluginPackages\nativetavern.story-timeline.ntplugin `
            --repo $env:GITHUB_REPOSITORY `
            --title "Lorehaven $env:GITHUB_REF_NAME" `
            --generate-notes
